<div id="view-app" class="top-page">
    <div class="app-layout">
        <header class="topbar">
            <div class="greeting">
                <span class="greeting-kicker">Welcome back</span>
                <h1 class="greeting-name">UniBooker</h1>
            </div>
            <div class="topbar-tools">
                <button type="button" class="icon-button press theme-toggle" title="Dark mode">
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#theme-moon" />
                    </svg>
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#theme-sun" />
                    </svg>
                </button>
                <button type="button" class="icon-button press" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#settings" />
                    </svg>
                </button>
            </div>
        </header>
        <main class="bento">
            <section class="card card-hero" style="--i: 0">
                <h2 class="card-title">Next up</h2>
                <p class="card-placeholder">Your closest appointment will appear here.</p>
            </section>
            <section class="card" style="--i: 1">
                <h2 class="card-title">Today</h2>
                <p class="card-placeholder">Mini calendar.</p>
            </section>
            <section class="card" style="--i: 2">
                <h2 class="card-title">Quick actions</h2>
                <p class="card-placeholder">Create, find, invite.</p>
            </section>
            <section class="card card-wide" style="--i: 3">
                <h2 class="card-title">My appointments</h2>
                <p class="card-placeholder">Bookings you've made.</p>
            </section>
            <section class="card" style="--i: 4">
                <h2 class="card-title">Requests</h2>
                <p class="card-placeholder">Meeting requests waiting on you.</p>
            </section>
            <section class="card card-wide" style="--i: 5">
                <h2 class="card-title">My slots</h2>
                <p class="card-placeholder">Slots you host.</p>
            </section>
            <section class="card" style="--i: 6">
                <h2 class="card-title">Teammates</h2>
                <p class="card-placeholder">Find people to team up with.</p>
            </section>
        </main>
    </div>
</div>
