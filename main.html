<div id="view-app" class="top-page">
    <div class="app-layout">
        <header class="topbar">
            <h1 class="wordmark">UniBooker</h1>
            <div class="topbar-tools">
                <button type="button" class="icon-button press notif-bell" data-action="open-notifications" title="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#bell" />
                    </svg>
                    <span class="notif-dot" hidden></span>
                </button>
                <button type="button" class="icon-button press theme-toggle" title="Dark mode">
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#theme-moon" />
                    </svg>
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#theme-sun" />
                    </svg>
                </button>
                <button type="button" class="icon-button press" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#settings" />
                    </svg>
                </button>
                <div class="account">
                    <button type="button" class="avatar press" title="Account" aria-haspopup="menu" aria-expanded="false">
                        <span class="avatar-initial">U</span>
                    </button>
                    <div class="account-menu" role="menu" hidden></div>
                </div>
            </div>
        </header>

        <main class="main-wrap">
            <section class="card card-wide card-slots" style="--i: 0" data-role="owner">
                <header class="card-header">
                    <div class="card-heading">
                        <svg class="card-icon" width="14" height="14" viewBox="0 0 24 24"><use href="assets/icons.svg#clock" /></svg>
                        <h2 class="card-title">Slots</h2>
                    </div>
                    <div class="card-actions">
                        <button type="button" class="ghost-button press" data-action="share-link">
                            <svg width="14" height="14" viewBox="0 0 24 24"><use href="assets/icons.svg#link" /></svg>
                            <span>Share link</span>
                        </button>
                        <button type="button" class="primary-button press" data-action="new-slot">
                            <svg width="14" height="14" viewBox="0 0 24 24"><use href="assets/icons.svg#plus" /></svg>
                            <span>New slot</span>
                        </button>
                    </div>
                </header>
                <ul class="slot-list owner-slot-list" hidden></ul>
                <div class="empty-state" data-empty="owner-slots">No slots yet. Click New slot to create one.</div>
            </section>

            <section class="card card-wide card-profs" style="--i: 0" data-role="student">
                <header class="card-header">
                    <div class="card-heading">
                        <svg class="card-icon" width="14" height="14" viewBox="0 0 24 24"><use href="assets/icons.svg#users" /></svg>
                        <h2 class="card-title">Professors</h2>
                    </div>
                </header>
                <div class="prof-sections">
                    <section class="prof-section" data-section="pinned">
                        <h3 class="prof-subheading">Pinned</h3>
                        <ul class="prof-list" data-list="pinned" hidden></ul>
                        <div class="prof-empty" data-empty="pinned">Pin a professor below to keep them here.</div>
                    </section>
                    <section class="prof-section" data-section="discover">
                        <h3 class="prof-subheading">Discover</h3>
                        <ul class="prof-list" data-list="discover" hidden></ul>
                        <div class="prof-empty" data-empty="discover">No professors have active slots yet.</div>
                    </section>
                </div>
            </section>

            <section class="card card-full card-upcoming" style="--i: 1">
                <header class="card-header">
                    <div class="card-heading">
                        <svg class="card-icon" width="14" height="14" viewBox="0 0 24 24"><use href="assets/icons.svg#calendar-days" /></svg>
                        <h2 class="card-title">Upcoming</h2>
                    </div>
                    <div class="view-switcher" role="tablist" aria-label="View">
                        <button type="button" class="view-switcher-option" role="tab" aria-selected="true" data-view="month">Month</button>
                        <button type="button" class="view-switcher-option" role="tab" aria-selected="false" data-view="week">Week</button>
                    </div>
                </header>
                <div class="upcoming-body">
                    <div class="upcoming-calendar"></div>
                    <ul class="upcoming-list" hidden></ul>
                    <div class="empty-state" data-empty="upcoming">No upcoming bookings.</div>
                </div>
            </section>
        </main>

        <dialog class="ui-dialog slot-dialog">
            <form class="dialog-form" data-form="new-slot">
                <header class="dialog-header">
                    <h2 class="dialog-title">New slot</h2>
                    <button type="button" class="icon-button press" data-action="close-dialog" title="Close">
                        <svg width="18" height="18" viewBox="0 0 24 24"><use href="assets/icons.svg#x" /></svg>
                    </button>
                </header>
                <label class="dialog-field">
                    <span>Date</span>
                    <input type="hidden" name="date" required>
                    <div class="slot-picker-calendar"></div>
                </label>
                <label class="dialog-field">
                    <span>Time</span>
                    <input type="hidden" name="time" required>
                    <div class="slot-time-picker"></div>
                </label>
                <p class="dialog-error" hidden></p>
                <footer class="dialog-footer">
                    <button type="button" class="primary-button-ghost press" data-action="close-dialog">Cancel</button>
                    <button type="submit" class="primary-button press">Create slot</button>
                </footer>
            </form>
        </dialog>
    </div>
</div>

<div id="view-invite" class="top-page" hidden>
    <div class="app-layout">
        <header class="topbar">
            <a class="topbar-back" href="#/" title="Home">
                <h1 class="wordmark">UniBooker</h1>
            </a>
            <div class="topbar-tools">
                <button type="button" class="icon-button press theme-toggle" title="Dark mode">
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24"><use href="assets/icons.svg#theme-moon" /></svg>
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24"><use href="assets/icons.svg#theme-sun" /></svg>
                </button>
                <button type="button" class="icon-button press" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24"><use href="assets/icons.svg#settings" /></svg>
                </button>
                <div class="account invite-account">
                    <button type="button" class="avatar press" title="Account" aria-haspopup="menu" aria-expanded="false">
                        <span class="avatar-initial">U</span>
                    </button>
                    <div class="account-menu" role="menu" hidden></div>
                </div>
            </div>
        </header>
        <main class="invite-wrap">
            <div class="invite-inner"></div>
        </main>
    </div>
</div>
