<div id="view-auth" class="top-page is-visible">
    <div class="auth-toolbar">
        <button type="button" class="icon-button press theme-toggle" title="Dark mode">
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24">
                <use href="assets/icons.svg#theme-moon" />
            </svg>
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24">
                <use href="assets/icons.svg#theme-sun" />
            </svg>
        </button>
    </div>
    <div class="auth-layout">
        <form class="auth-stack" id="auth-form" novalidate>
            <h1 class="wordmark">UniBooker</h1>
            <div class="auth-field">
                <div class="auth-label-row">
                    <label class="auth-label" for="auth-email">Email</label>
                    <span class="auth-field-warning" id="warning-auth-email"></span>
                </div>
                <input type="email" id="auth-email" class="auth-input" autocomplete="email" placeholder="name@example.com">
            </div>
            <div class="auth-field">
                <div class="auth-label-row">
                    <label class="auth-label" for="auth-password">Password</label>
                    <span class="auth-field-warning" id="warning-auth-password"></span>
                </div>
                <input type="password" id="auth-password" class="auth-input" autocomplete="current-password" placeholder="Password">
            </div>
            <button type="submit" class="auth-action-button auth-signin-button press" id="auth-signin-button">Sign in</button>
            <button type="button" class="auth-action-button auth-register-button press" id="auth-register-button">Register</button>
            <button type="button" class="auth-forgot-button press" id="auth-forgot-button">Forgot password?</button>
            <div class="auth-accounts-wrap" id="auth-accounts" hidden></div>
        </form>
    </div>
</div>
