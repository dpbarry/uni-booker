<div id="view-app" class="top-page">
    <div class="app-layout">
        <aside class="app-strip">
            <nav class="app-strip-nav">
                <a class="nav-link nav-link--icon press icon-hit" href="#/dashboard" data-route="dashboard" title="Dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#nav-dashboard" />
                    </svg>
                </a>
                <a class="nav-link nav-link--icon press icon-hit" href="#/calendar" data-route="calendar" title="Calendar">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <use href="assets/icons.svg#nav-calendar" />
                    </svg>

            </nav>
            <div class="app-strip-tools">
